# Reload tmux config
# :source-file ~/.tmux.conf
# tmux source-file ~/.tmux.conf

# Colors (truecolor + OSC 8 links; outer term is gnome-terminal/VTE as xterm-256color)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm*:RGB:hyperlinks:focus"
set -g focus-events on

# Extended keys (CSI u) for apps that ask; VTE itself won't send Shift+Enter
set -s extended-keys on

# Let apps (e.g. Claude Code notifications) pass escapes through to the terminal
set -g allow-passthrough on

# Refresh these from the client env on attach / new session
set -ag update-environment " WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS BROWSER COLORTERM"

# Mouse mode
set -g mouse on

# rebind prefix
set -g prefix C-o
bind C-a send-prefix
unbind C-b

# switching panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resizing panes
bind H resize-pane -L 8
bind J resize-pane -D 8
bind K resize-pane -U 8
bind L resize-pane -R 8

# Copy mode: C-o ESC
setw -g mode-keys vi
bind Escape copy-mode

# Select whole line, like vim, C-o CAPS C-o V
bind -T copy-mode-vi V send-keys -X rectangle-toggle
bind V send-keys "0v\$"

# To select: C-o CAPS v
bind -T copy-mode-vi v send-keys -X begin-selection

# to PASTE (within tmux): C-o p
unbind [        # was paste buffer
unbind p        # was previous window
bind p paste-buffer

# to PASTE (from system clipboard to tmux): C-o P
unbind P
bind P run "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"

# COPY: C-o ESC y (also goes to system clipboard)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

# Accept OSC 52 from apps (Claude Code /copy) into a tmux buffer
# (was off to stop random characters during yank; revert to off if they return)
set -s set-clipboard on
# VTE ignores OSC 52, so push app-set clipboard to X ourselves
set-hook -g pane-set-clipboard 'run -b "tmux save-buffer - | xclip -sel clip -i"'

# Open new windows and panes with same directory as PWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Change color of border for active window
# set -g pane-border-fg gray
set -g pane-active-border-style "fg=#26a8d2,bg=default"

# Cool status bar
set -g status-style "fg=white,bg=blue"
set-option -g status-right '#[fg=white,bright]Load: #(uptime | rev | cut -d":" -f1 | rev | sed s/,//g )'

# Remove delay pressing esc key (normal mode in vim) on linux distros
set -sg escape-time 0

# Kill program in pane without killing pane
bind a respawn-pane -k

# More scrollback
set-option -g history-limit 20000
